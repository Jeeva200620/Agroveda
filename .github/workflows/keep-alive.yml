name: Keep Hugging Face Space Awake

on:
  schedule:
    # Runs at minute 0 of every 6th hour (4 times a day)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://jeevakm-agroveda.hf.space/ping
